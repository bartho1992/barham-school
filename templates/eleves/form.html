{% extends "base.html" %}
{% block title %}{{ 'Modifier' if eleve else 'Inscrire' }} eleve - {{ ecole.nom }}{% endblock %}
{% block content %}
<h3 class="mb-3"><i class="bi bi-person-plus"></i> {{ 'Modifier' if eleve else 'Inscrire' }} un eleve</h3>
<div class="card shadow-sm">
    <div class="card-body">
        <form method="POST">
            <div class="row g-3">
                <div class="col-md-3">
                    <label class="form-label fw-bold">Code *</label>
                    <input type="text" name="code" class="form-control" value="{{ eleve.code if eleve else auto_code }}" required>
                </div>
                <div class="col-md-4">
                    <label class="form-label fw-bold">Prenom *</label>
                    <input type="text" name="prenom" class="form-control" value="{{ eleve.prenom if eleve }}" required>
                </div>
                <div class="col-md-4">
                    <label class="form-label fw-bold">Nom *</label>
                    <input type="text" name="nom" class="form-control" value="{{ eleve.nom if eleve }}" required>
                </div>
                <div class="col-md-1">
                    <label class="form-label fw-bold">Sexe</label>
                    <select name="sexe" class="form-select">
                        <option value="M" {% if eleve and eleve.sexe=='M' %}selected{% endif %}>M</option>
                        <option value="F" {% if eleve and eleve.sexe=='F' %}selected{% endif %}>F</option>
                    </select>
                </div>
                <div class="col-md-3">
                    <label class="form-label fw-bold">Classe</label>
                    <select name="classe_id" class="form-select">
                        <option value="">-- Choisir --</option>
                        {% for c in classes %}
                        <option value="{{ c.id }}" {% if eleve and eleve.classe_id==c.id %}selected{% endif %}>{{ c.nom }}</option>
                        {% endfor %}
                    </select>
                </div>
                <div class="col-md-3">
                    <label class="form-label">Telephone</label>
                    <input type="text" name="tel" class="form-control" value="{{ eleve.tel if eleve }}">
                </div>
                <div class="col-md-3">
                    <label class="form-label">Date de naissance</label>
                    <input type="date" name="date_naissance" class="form-control" value="{{ eleve.date_naissance if eleve }}">
                </div>
                <div class="col-md-3">
                    <label class="form-label">Lieu de naissance</label>
                    <input type="text" name="lieu_naissance" class="form-control" value="{{ eleve.lieu_naissance if eleve }}">
                </div>
                <div class="col-md-3">
                    <label class="form-label">Tuteur</label>
                    <input type="text" name="tuteur" class="form-control" value="{{ eleve.tuteur if eleve }}">
                </div>
                <div class="col-md-3">
                    <label class="form-label">Adresse</label>
                    <input type="text" name="adresse" class="form-control" value="{{ eleve.adresse if eleve }}">
                </div>
                <div class="col-md-3">
                    <label class="form-label">Ecole precedente</label>
                    <input type="text" name="precedente_ecole" class="form-control" value="{{ eleve.precedente_ecole if eleve }}">
                </div>
                <div class="col-md-3">
                    <label class="form-label">Date d'entree</label>
                    <input type="date" name="date_entree" class="form-control" value="{{ eleve.date_entree if eleve }}">
                </div>
                <div class="col-md-3">
                    <label class="form-label fw-bold">Situation</label>
                    <select name="situation" class="form-select">
                        <option value="Inscrit" {% if eleve and eleve.situation=='Inscrit' %}selected{% endif %}>Inscrit</option>
                        <option value="Transfere" {% if eleve and eleve.situation=='Transfere' %}selected{% endif %}>Transfere</option>
                        <option value="Renvoye" {% if eleve and eleve.situation=='Renvoye' %}selected{% endif %}>Renvoye</option>
                        <option value="Desinscrit" {% if eleve and eleve.situation=='Desinscrit' %}selected{% endif %}>Desinscrit</option>
                    </select>
                </div>
                <div class="col-md-6">
                    <label class="form-label">Observations</label>
                    <textarea name="observations" class="form-control" rows="2">{{ eleve.observations if eleve }}</textarea>
                </div>
            </div>
            <hr>
            <div class="d-flex gap-2">
                <button type="submit" class="btn btn-primary"><i class="bi bi-check-lg"></i> Enregistrer</button>
                <a href="{{ url_for('eleves') }}" class="btn btn-secondary"><i class="bi bi-arrow-left"></i> Retour</a>
            </div>
        </form>
    </div>
</div>
{% endblock %}
