{% extends "base.html" %}
{% block title %}Connexion - Barham School{% endblock %}

{% block extra_css %}
<style>
    /* Adjust page layout when on login page to hide sidebar defaults and footer if necessary */
    body {
        overflow: hidden !important;
    }
    .app-main {
        background: transparent !important;
    }
    .container-fluid {
        padding: 0 !important;
        overflow: hidden !important;
        height: 100vh;
    }
</style>
{% endblock %}

{% block content %}
<div class="login-page">
    <div class="login-card">
        <div class="login-icon">
            <i class="bi bi-mortarboard-fill"></i>
        </div>
        <h4>Barham School</h4>
        <p class="login-subtitle">Gestion d'Établissement Scolaire</p>
        
        <div class="login-links">
            <a href="{{ url_for('pricing') }}">
                <i class="bi bi-tag-fill me-1"></i> Tarifs
            </a>
            <a href="{{ url_for('tutoriel') }}">
                <i class="bi bi-play-circle me-1"></i> Aide
            </a>
        </div>
        
        <form method="POST">
            <div class="mb-3">
                <label class="form-label fw-semibold text-white-50">Identifiant</label>
                <div class="input-group">
                    <span class="input-group-text"><i class="bi bi-person"></i></span>
                    <input type="text" name="username" class="form-control text-white" placeholder="Saisir votre identifiant" required autofocus>
                </div>
            </div>
            
            <div class="mb-4">
                <label class="form-label fw-semibold text-white-50">Mot de passe</label>
                <div class="input-group">
                    <span class="input-group-text"><i class="bi bi-lock"></i></span>
                    <input type="password" name="password" id="passwordInput" class="form-control text-white" placeholder="Saisir votre mot de passe" required>
                    <button type="button" class="btn text-white-50" id="togglePasswordBtn">
                        <i class="bi bi-eye" id="eyeIcon"></i>
                    </button>
                </div>
            </div>
            
            <button type="submit" class="btn btn-login"><i class="bi bi-box-arrow-in-right me-1"></i> Se connecter</button>
        </form>
        
        <div class="login-footer">
            <span class="text-white-50">Pas encore de compte ?</span><br>
            <a href="{{ url_for('register') }}" class="btn btn-success btn-sm mt-2 px-3 py-1.5 rounded-pill text-white fw-bold">
                <i class="bi bi-person-plus-fill me-1"></i> Créer un compte gratuit
            </a>
        </div>
    </div>
</div>

<script>
document.addEventListener('DOMContentLoaded', function() {
    const toggleBtn = document.getElementById('togglePasswordBtn');
    const passwordInput = document.getElementById('passwordInput');
    const eyeIcon = document.getElementById('eyeIcon');
    
    toggleBtn.addEventListener('click', function() {
        if (passwordInput.type === 'password') {
            passwordInput.type = 'text';
            eyeIcon.className = 'bi bi-eye-slash';
        } else {
            passwordInput.type = 'password';
            eyeIcon.className = 'bi bi-eye';
        }
    });
});
</script>
{% endblock %}
