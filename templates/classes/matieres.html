{% extends "base.html" %}
{% block title %}Matieres - {{ ecole.nom }}{% endblock %}
{% block content %}
<div class="d-flex justify-content-between align-items-center mb-2 flex-nowrap gap-1">
    <h5 class="mb-0"><i class="bi bi-book"></i> Matieres</h5>
    <div class="d-flex flex-nowrap gap-1">
        <button id="btnSupprimerBulk" class="btn btn-danger btn-sm d-none" onclick="supprimerSelection()">
            <i class="bi bi-trash"></i> Supprimer la sélection
        </button>
        <a href="{{ url_for('matiere_ajouter', embed=embed) }}" class="btn btn-primary btn-sm"><i class="bi bi-plus-lg"></i> Ajouter</a>
    </div>
</div>
<form id="formBulk" method="POST" action="{{ url_for('matiere_supprimer_bulk', embed=embed) }}">
    <div style="max-height:65vh;overflow-y:auto;overflow-x:hidden;">
        <table class="table table-sm table-bordered align-middle bg-white w-100 mb-0">
            <thead class="table-primary" style="position:sticky;top:0;z-index:2;">
                <tr>
                    <th style="width:40px;"><input class="form-check-input" type="checkbox" id="selectAll" onchange="toggleAll(this)"></th>
                    <th>Matiere</th>
                    <th>Domaine</th>
                    <th class="text-center" style="width:55px;">Coeff</th>
                    <th class="text-center" style="width:75px;">Actions</th>
                </tr>
            </thead>
            <tbody>
                {% for m in matieres %}
                <tr>
                    <td class="text-center">
                        <input class="form-check-input matiere-check" type="checkbox" name="matiere_ids[]" value="{{ m.id }}" onchange="updateBouton()">
                    </td>
                    <td class="small">{{ m.nom }}</td>
                    <td class="small"><span class="badge bg-secondary">{{ m.domaine or '-' }}</span></td>
                    <td class="text-center small">{{ m.coefficient }}</td>
                    <td class="text-center">
                        <a href="{{ url_for('matiere_modifier', id=m.id, embed=embed) }}" class="text-warning me-1" title="Modifier"><i class="bi bi-pencil"></i></a>
                        <a href="#" onclick="if(confirm('Supprimer ?')){var f=document.createElement('form');f.method='POST';f.action='{{ url_for('matiere_supprimer', id=m.id, embed=embed) }}';document.body.appendChild(f);f.submit();}return false;" class="text-danger" title="Supprimer"><i class="bi bi-trash"></i></a>
                    </td>
                </tr>
                {% endfor %}
            </tbody>
        </table>
    </div>
</form>
<script>
function toggleAll(s) { document.querySelectorAll('.matiere-check').forEach(cb => cb.checked = s.checked); updateBouton(); }
function updateBouton() {
    var n = document.querySelectorAll('.matiere-check:checked').length;
    var b = document.getElementById('btnSupprimerBulk');
    if (n > 0) { b.classList.remove('d-none'); b.innerHTML = '<i class="bi bi-trash"></i> Supprimer (' + n + ')'; }
    else b.classList.add('d-none');
}
function supprimerSelection() {
    var n = document.querySelectorAll('.matiere-check:checked').length;
    if (n === 0) return;
    if (!confirm('Supprimer ' + n + ' matière(s) ? Les notes liées seront également supprimées.')) return;
    document.getElementById('formBulk').submit();
}
</script>
{% endblock %}
