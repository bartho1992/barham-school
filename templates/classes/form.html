{% extends "base.html" %}
{% block title %}{{ 'Modifier' if classe else 'Ajouter' }} classe{% endblock %}
{% block content %}
<h3 class="mb-3"><i class="bi bi-building"></i> {{ 'Modifier' if classe else 'Ajouter' }} une classe</h3>

<div class="card shadow-sm"><div class="card-body">
<form method="POST">
    <div class="mb-3">
        <label class="form-label fw-bold">Nom de la classe *</label>
        <input type="text" name="nom" class="form-control" value="{{ classe.nom if classe else '' }}" placeholder="Ex: 6eme_A, CE1B, TLE_S2" required>
    </div>
    <div class="mb-3">
        <label class="form-label fw-bold">Niveau</label>
        <select name="niveau" class="form-select">
            <option value="">Sans niveau</option>
            <option value="Prescolaire" {% if classe and classe.niveau=='Prescolaire' %}selected{% endif %}>Prescolaire</option>
            <option value="Elementaire" {% if classe and classe.niveau=='Elementaire' %}selected{% endif %}>Elementaire</option>
            <option value="Moyen Secondaire" {% if classe and classe.niveau=='Moyen Secondaire' %}selected{% endif %}>Moyen Secondaire</option>
            <option value="Secondaire" {% if classe and classe.niveau=='Secondaire' %}selected{% endif %}>Secondaire</option>
        </select>
    </div>
    <hr>
    <div class="d-flex gap-2">
        <button type="submit" class="btn btn-primary"><i class="bi bi-check-lg"></i> {{ 'Enregistrer' if classe else 'Ajouter' }}</button>
        <a href="{{ url_for('classes') }}" class="btn btn-secondary"><i class="bi bi-arrow-left"></i> Retour a la liste</a>
    </div>
</form>
</div></div>
{% endblock %}
