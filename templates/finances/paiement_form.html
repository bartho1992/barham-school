{% extends "base.html" %}
{% block title %}Nouveau paiement{% endblock %}
{% block content %}
<h3 class="mb-3"><i class="bi bi-cash"></i> Enregistrer un paiement</h3>
<div class="card shadow-sm"><div class="card-body">
<form method="POST">
    <div class="row g-3">
        <div class="col-md-6">
            <label class="form-label fw-bold">Eleve *</label>
            <select name="eleve_id" class="form-select" required>
                <option value="">-- Choisir --</option>
                {% for e in eleves %}
                <option value="{{ e.id }}">{{ e.prenom }} {{ e.nom }} ({{ e.classe.nom if e.classe else '-' }})</option>
                {% endfor %}
            </select>
        </div>
        <div class="col-md-6">
            <label class="form-label fw-bold">Type de paiement *</label>
            <select name="type_paiement" class="form-select" required>
                <option value="INSCRIPTION">Inscription</option>
                <option value="SCOLARITE">Scolarite</option>
                <option value="FOURNITURE">Fourniture</option>
                <option value="CANTINE">Cantine</option>
                <option value="TRANSPORT">Transport</option>
                <option value="PETIT DEJ">Petit Dejeuner</option>
                <option value="AUTRE">Autre</option>
            </select>
        </div>
        <div class="col-md-4">
            <label class="form-label fw-bold">Montant paye</label>
            <input type="number" name="montant" class="form-control" step="100" value="0">
        </div>
        <div class="col-md-4">
            <label class="form-label">Montant attendu</label>
            <input type="number" name="montant_attendu" class="form-control" step="100" value="0">
        </div>
        <div class="col-md-4">
            <label class="form-label">Montant restant</label>
            <input type="number" name="montant_restant" class="form-control" step="100" value="0">
        </div>
    </div>
    <hr>
    <button type="submit" class="btn btn-primary"><i class="bi bi-check-lg"></i> Enregistrer</button>
    <a href="{{ url_for('finances_liste') }}" class="btn btn-secondary"><i class="bi bi-arrow-left"></i> Retour</a>
</form>
</div></div>
{% endblock %}
