{% extends "base.html" %}

{% block title %}Gestion Financière - {{ ecole.nom }}{% endblock %}

{% block extra_css %}
<style>
.hub-nav { display: flex; gap: 4px; border-bottom: 2px solid #dee2e6; margin-bottom: 8px; flex-wrap: wrap; }
.hub-btn { 
    padding: 6px 16px; border: none; color: #fff; 
    font-weight: 700; font-size: 0.75rem; cursor: pointer; 
    border-radius: 8px 8px 0 0; margin-bottom: -2px; transition: all 0.2s;
    white-space: nowrap; opacity: 0.55;
}
.hub-btn:hover { opacity: 0.85; }
.hub-btn.active { opacity: 1; box-shadow: 0 -2px 6px rgba(0,0,0,0.15); }
#btn-finances { background: #0d6efd; }
#btn-impayes { background: #dc3545; }
#btn-paiements { background: #6f42c1; }
#btn-nouveau { background: #198754; }
#btn-inscription { background: #fd7e14; }
#btn-annuler { background: #e74c3c; }
.hub-content { min-height: 60vh; background: #fff; border-radius: 0 0 8px 8px; }
.hub-loader { display: flex; align-items: center; justify-content: center; padding: 3rem; color: #999; font-size: 0.85rem; }
</style>
{% endblock %}

{% block content %}
<div class="d-flex justify-content-between align-items-center mb-1 flex-wrap gap-2">
    <h6 class="mb-0"><i class="bi bi-wallet2 text-primary"></i> Gestion Financière</h6>
    <a href="{{ url_for('parametres_financiers') }}" class="btn btn-sm btn-outline-success"><i class="bi bi-gear"></i> Paramètres</a>
</div>

<div class="hub-nav">
    <button class="hub-btn active" onclick="showHub('finances', '{{ url_for('finances', embed='1') }}')" id="btn-finances">
        <i class="bi bi-bar-chart"></i> Finances
    </button>
    <button class="hub-btn" onclick="showHub('impayes', '{{ url_for('impayes', embed='1') }}')" id="btn-impayes">
        <i class="bi bi-exclamation-triangle"></i> Impayés
    </button>
    <button class="hub-btn" onclick="showHub('paiements', '{{ url_for('finances_liste', embed='1') }}')" id="btn-paiements">
        <i class="bi bi-list-ul"></i> Paiements
    </button>
    <button class="hub-btn" onclick="showHub('nouveau', '{{ url_for('paiement_ajouter', embed='1') }}')" id="btn-nouveau">
        <i class="bi bi-plus-circle"></i> Nouveau Paiement
    </button>
    <button class="hub-btn" onclick="showHub('inscription', '{{ url_for('eleve_ajouter', embed='1') }}')" id="btn-inscription">
        <i class="bi bi-person-plus"></i> Inscription
    </button>
    <button class="hub-btn" onclick="showHub('annuler', '{{ url_for('paiements_annuler', embed='1') }}')" id="btn-annuler">
        <i class="bi bi-x-circle"></i> Annuler
    </button>
</div>

<div class="hub-content" id="hubContent">
    <div class="hub-loader"><i class="bi bi-hourglass-split me-2"></i>Chargement...</div>
</div>

<script>
var cache = {};
var currentTab = 'finances';

function showHub(name, url) {
    // Onglets actifs
    document.querySelectorAll('.hub-btn').forEach(function(b) { b.classList.remove('active'); });
    document.getElementById('btn-' + name).classList.add('active');
    currentTab = name;

    // Afficher le loader
    document.getElementById('hubContent').innerHTML = '<div class="hub-loader"><i class="bi bi-hourglass-split me-2"></i>Chargement...</div>';

    // Utiliser le cache ou charger
    if (cache[name]) {
        document.getElementById('hubContent').innerHTML = cache[name];
        reinitScripts();
    } else {
        fetch(url)
            .then(function(r) { return r.text(); })
            .then(function(html) {
                // Extraire uniquement le contenu du block content
                var parser = new DOMParser();
                var doc = parser.parseFromString(html, 'text/html');
                var content = doc.querySelector('.app-main .container-fluid') || doc.querySelector('.container-fluid') || doc.body;
                cache[name] = content.innerHTML;
                document.getElementById('hubContent').innerHTML = cache[name];
                reinitScripts();
            })
            .catch(function() {
                document.getElementById('hubContent').innerHTML = '<div class="hub-loader text-danger"><i class="bi bi-exclamation-circle me-2"></i>Erreur de chargement</div>';
            });
    }
}

function reinitScripts() {
    // Re-execute les scripts inline dans le contenu charge
    var scripts = document.getElementById('hubContent').querySelectorAll('script');
    scripts.forEach(function(oldScript) {
        var newScript = document.createElement('script');
        newScript.textContent = oldScript.textContent;
        oldScript.parentNode.replaceChild(newScript, oldScript);
    });
    // Re-trigger card view if mobile
    if (typeof initCardView === 'function') initCardView();
}

// Charger le premier onglet
showHub('finances', '{{ url_for('finances', embed='1') }}');
</script>
{% endblock %}
