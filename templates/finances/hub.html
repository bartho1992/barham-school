{% extends "base.html" %}

{% block title %}Gestion Financière - {{ ecole.nom }}{% endblock %}

{% block extra_css %}
<style>
.hub-nav { display: flex; gap: 4px; border-bottom: 2px solid #dee2e6; margin-bottom: 0; flex-wrap: wrap; }
.hub-btn { 
    padding: 6px 16px; border: none; color: #fff; 
    font-weight: 700; font-size: 0.75rem; cursor: pointer; 
    border-radius: 8px 8px 0 0; margin-bottom: -2px; transition: all 0.2s;
    white-space: nowrap; opacity: 0.55;
}
.hub-btn:hover { opacity: 0.85; }
.hub-btn.active { opacity: 1; box-shadow: 0 -2px 6px rgba(0,0,0,0.15); }
/* Couleurs distinctes par onglet */
#btn-finances { background: #0d6efd; }
#btn-impayes { background: #dc3545; }
#btn-paiements { background: #6f42c1; }
#btn-nouveau { background: #198754; }
#btn-inscription { background: #fd7e14; }
.hub-frame { width: 100%; height: calc(100vh - 100px); border: none; display: none; }
.hub-frame.active { display: block; }
.hub-frame.loading { background: #f8f9fa; display: flex; align-items: center; justify-content: center; color: #999; font-size: 0.8rem; }
</style>
{% endblock %}

{% block content %}
<div class="d-flex justify-content-between align-items-center mb-1 flex-wrap gap-2">
    <h6 class="mb-0"><i class="bi bi-wallet2 text-primary"></i> Gestion Financière</h6>
    <a href="{{ url_for('parametres_financiers') }}" class="btn btn-sm btn-outline-success"><i class="bi bi-gear"></i> Paramètres</a>
</div>

<div class="hub-nav">
    <button class="hub-btn active" onclick="showHub('finances')" id="btn-finances">
        <i class="bi bi-bar-chart"></i> Finances
    </button>
    <button class="hub-btn" onclick="showHub('impayes')" id="btn-impayes">
        <i class="bi bi-exclamation-triangle"></i> Impayés
    </button>
    <button class="hub-btn" onclick="showHub('paiements')" id="btn-paiements">
        <i class="bi bi-list-ul"></i> Paiements
    </button>
    <button class="hub-btn" onclick="showHub('nouveau')" id="btn-nouveau">
        <i class="bi bi-plus-circle"></i> Nouveau Paiement
    </button>
    <button class="hub-btn" onclick="showHub('inscription')" id="btn-inscription">
        <i class="bi bi-person-plus"></i> Inscription
    </button>
</div>

<div style="background:#fff;">
    <iframe id="frame-finances" class="hub-frame active" data-src="{{ url_for('finances', embed='1') }}"></iframe>
    <iframe id="frame-impayes" class="hub-frame" data-src="{{ url_for('impayes', embed='1') }}"></iframe>
    <iframe id="frame-paiements" class="hub-frame" data-src="{{ url_for('finances_liste', embed='1') }}"></iframe>
    <iframe id="frame-nouveau" class="hub-frame" data-src="{{ url_for('paiement_ajouter', embed='1') }}"></iframe>
    <iframe id="frame-inscription" class="hub-frame" data-src="{{ url_for('eleve_ajouter', embed='1') }}"></iframe>
</div>

<script>
// Lazy load : charge l'iframe uniquement quand on clique sur l'onglet
var loaded = {};

function showHub(name) {
    // Onglets actifs
    document.querySelectorAll('.hub-btn').forEach(function(b) { b.classList.remove('active'); });
    document.getElementById('btn-' + name).classList.add('active');
    
    // Frames
    document.querySelectorAll('.hub-frame').forEach(function(f) { f.classList.remove('active'); });
    var frame = document.getElementById('frame-' + name);
    frame.classList.add('active');
    
    // Charger si pas encore fait
    if (!loaded[name]) {
        loaded[name] = true;
        frame.src = frame.getAttribute('data-src');
    }
}

// Charger le premier onglet
loaded['finances'] = true;
document.getElementById('frame-finances').src = document.getElementById('frame-finances').getAttribute('data-src');
</script>
{% endblock %}
