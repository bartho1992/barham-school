{% extends "base.html" %}
{% block title %}Paiement Carte Bancaire{% endblock %}
{% block content %}
<div class="container py-5" style="max-width:480px;">
    <div class="text-center mb-4">
        <i class="bi bi-credit-card-fill text-primary fs-1"></i>
        <h4 class="mt-2">Paiement par carte</h4>
        <p class="text-muted">{{ "{:,.0f}".format(montant) }} FCFA</p>
    </div>
    <div class="card shadow-sm border-0 mb-3">
        <div class="card-body p-4">
            <form onsubmit="event.preventDefault(); alert('Paiement simulé — cliquez sur Confirmer');">
                <div class="mb-3">
                    <label class="small fw-semibold">Numéro de carte</label>
                    <input class="form-control" value="4242 4242 4242 4242" readonly>
                </div>
                <div class="row g-2 mb-3">
                    <div class="col-8">
                        <label class="small fw-semibold">Expiration</label>
                        <input class="form-control" value="12/28" readonly>
                    </div>
                    <div class="col-4">
                        <label class="small fw-semibold">CVC</label>
                        <input class="form-control" value="123" readonly>
                    </div>
                </div>
                <button type="submit" class="btn btn-primary w-100 rounded-pill">Payer {{ "{:,.0f}".format(montant) }} FCFA</button>
            </form>
        </div>
    </div>
    <a href="{{ url_for('abonnement_callback', facture_id=facture.id) }}" class="btn btn-success btn-lg w-100 rounded-pill">
        <i class="bi bi-check-circle me-1"></i> Confirmer le paiement
    </a>
    <p class="text-center text-muted mt-2" style="font-size:0.6rem;">Démo — en production : Stripe Checkout</p>
</div>
{% endblock %}
