{% extends "base.html" %}
{% block title %}Notes - {{ ecole.nom }}{% endblock %}
{% block content %}
<div class="d-flex justify-content-between align-items-center mb-2">
    <h5 class="mb-0"><i class="bi bi-pencil-square"></i> Saisie des Notes</h5>
    <span class="badge bg-warning text-dark">Annee: {{ current_annee }}</span>
</div>

<div class="row g-2">
    {% for c in classes %}
    <div class="col-md-4 col-lg-3">
        <div class="card shadow-sm">
            <div class="card-body text-center py-2 px-3">
                <h6 class="fw-bold text-primary mb-1">{{ c.nom }}</h6>
                <small class="text-muted d-block mb-2">{{ c.niveau or '' }}</small>
                <div class="d-flex gap-1 justify-content-center flex-wrap">
                    <a href="{{ url_for('notes_saisir', classe_id=c.id, trimestre=1, embed=embed) }}" class="btn btn-outline-primary btn-sm py-0 px-1" title="1er Trimestre">T1</a>
                    <a href="{{ url_for('notes_saisir', classe_id=c.id, trimestre=2, embed=embed) }}" class="btn btn-outline-primary btn-sm py-0 px-1" title="2eme Trimestre">T2</a>
                    <a href="{{ url_for('notes_saisir', classe_id=c.id, trimestre=3, embed=embed) }}" class="btn btn-outline-primary btn-sm py-0 px-1" title="3eme Trimestre">T3</a>
                </div>
            </div>
        </div>
    </div>
    {% endfor %}
</div>
{% endblock %}
