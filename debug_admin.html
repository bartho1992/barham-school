<!DOCTYPE html>
<html lang="fr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Connexion - Barham School</title>
    <link rel="icon" type="image/svg+xml" href="/static/favicon.svg">
    <link rel="shortcut icon" href="/static/favicon.ico">
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
    <link href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css" rel="stylesheet">
    <link href="/static/css/style.css?v=2" rel="stylesheet">
    
</head>
<body>
    <div class="app-layout no-sidebar">
        
        
        <!-- Contenu principal -->
        <main class="app-main">
            <div class="container-fluid" style="margin-top:0 !important; padding-top:0 !important;">
                
                
                
                <div class="alert alert-message alert-dismissible fade show">
                    Please log in to access this page.
                    <button type="button" class="btn-close" data-bs-dismiss="alert"></button>
                </div>
                
                
                

                
<div class="row justify-content-center mt-5">
    <div class="col-md-5">
        <div class="card shadow-lg border-0">
            <div class="card-header bg-primary text-white text-center py-3">
                <h4 class="mb-0"><i class="bi bi-mortarboard-fill"></i> Barham School</h4>
                <small>Abdou Diatta - Barham Informatique</small>
            </div>
            <div class="card-body p-4">
                <div class="text-center mb-3">
                    <a href="/pricing" class="btn btn-outline-primary btn-sm rounded-pill px-4">
                        <i class="bi bi-tag-fill me-1"></i> Voir les tarifs
                    </a>
                </div>
                <form method="POST">
                    <div class="mb-3">
                        <label class="form-label fw-bold">Identifiant</label>
                        <div class="input-group">
                            <span class="input-group-text"><i class="bi bi-person"></i></span>
                            <input type="text" name="username" class="form-control" placeholder="Identifiant" required autofocus>
                        </div>
                    </div>
                    <div class="mb-3">
                        <label class="form-label fw-bold">Mot de passe</label>
                        <div class="input-group">
                            <span class="input-group-text"><i class="bi bi-lock"></i></span>
                            <input type="password" name="password" id="passwordInput" class="form-control" placeholder="Mot de passe" required>
                            <button type="button" class="btn btn-outline-secondary" id="togglePasswordBtn">👁️</button>
                        </div>
                    </div>
                    <button type="submit" class="btn btn-primary w-100 py-2"><i class="bi bi-box-arrow-in-right"></i> Se connecter</button>
                </form>
                <hr class="my-3">
                <div class="text-center">
                    <small class="text-muted">Pas encore de compte ?</small><br>
                    <a href="/register" class="btn btn-success btn-sm mt-1">
                        <i class="bi bi-person-plus"></i> Creer un compte gratuit
                    </a>
                </div>
            </div>
            <div class="card-footer text-center text-muted">
                <small>Barham Informatique &copy; 2026-2027</small>
            </div>
        </div>
    </div>
</div>

<script>
document.addEventListener('DOMContentLoaded', function() {
    const toggleBtn = document.getElementById('togglePasswordBtn');
    const passwordInput = document.getElementById('passwordInput');
    
    toggleBtn.addEventListener('click', function() {
        if (passwordInput.type === 'password') {
            passwordInput.type = 'text';
            toggleBtn.textContent = '🙈';
        } else {
            passwordInput.type = 'password';
            toggleBtn.textContent = '👁️';
        }
    });
});
</script>

            </div>
            
            <footer class="text-center text-muted py-2 mt-auto border-top small">
                <small>Developpe par <strong>Abdou Diatta</strong> - <strong>Barham Informatique</strong> &copy; 2026-2027</small>
            </footer>
        </main>
    </div>

    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
    <script src="/static/js/main.js"></script>
    <script>
        // Automatic logout after 30 minutes of inactivity
        let inactivityTime = function () {
            let time;
            window.onload = resetTimer;
            document.onmousemove = resetTimer;
            document.onkeypress = resetTimer;

            function logout() {
                window.location.href = "/logout";
            }

            function resetTimer() {
                clearTimeout(time);
                time = setTimeout(logout, 30 * 60 * 1000); // 30 minutes
            }
        };
        
    </script>
    
</body>
</html>
